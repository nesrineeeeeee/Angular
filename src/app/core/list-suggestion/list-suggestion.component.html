<h2>Liste des suggestions</h2>

<!-- Two-way binding -->
<input
  type="text"
  placeholder="Rechercher par titre ou catégorie"
  [(ngModel)]="searchText"
/>

<hr />

<!-- NgFor -->
<div *ngFor="let s of filterSuggestions()">

  <!-- Interpolation -->
  <h3>{{ s.title }}</h3>
  <p>{{ s.description }}</p>

  <!-- Property binding -->
  <p><strong>Catégorie :</strong> {{ s.category }}</p>
  <p><strong>Date :</strong> {{ s.date | date:'dd/MM/yyyy' }}</p>
  <p><strong>Status :</strong> {{ s.status }}</p>
  <p><strong>Likes :</strong> {{ s.nbLikes }}</p>

  <!-- NgIf -->
  <div *ngIf="s.status !== 'refusee'">
    <!-- Event binding -->
    <button (click)="likeSuggestion(s)">👍 Like</button>
    <button (click)="addToFavorites(s)">⭐ Ajouter aux favoris</button>
  </div>

  <hr />
</div>

<h2>Suggestions favorites</h2>

<ul>
  <li *ngFor="let fav of favorites">
    {{ fav.title }}
  </li>
</ul>
