<!-- src/app/features/suggestions/suggestion-list/suggestion-list.component.html -->
<div class="container">
  <h2>Liste des suggestions</h2>

  <!-- Two-way binding -->
  <div class="row mb-3">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Rechercher par titre ou catégorie"
        [(ngModel)]="searchText"
      />
    </div>
  </div>

  <hr />

  <!-- NgFor -->
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let s of filterSuggestions()">
      <div class="card">
        <div class="card-body">
          <!-- Interpolation -->
          <h5 class="card-title">{{ s.title }}</h5>
          <p class="card-text">{{ s.description }}</p>

          <!-- Property binding -->
          <p><strong>Catégorie :</strong> {{ s.category }}</p>
          <p><strong>Date :</strong> {{ s.date | date:'dd/MM/yyyy' }}</p>
          <p><strong>Status :</strong> 
            <span [class.text-success]="s.status === 'acceptee'"
                  [class.text-danger]="s.status === 'refusee'"
                  [class.text-warning]="s.status === 'en_attente'">
              {{ s.status }}
            </span>
          </p>
          <p><strong>Likes :</strong> {{ s.nbLikes }}</p>

          <!-- NgIf -->
          <div *ngIf="s.status !== 'refusee'">
            <!-- Event binding -->
            <button class="btn btn-primary me-2" (click)="likeSuggestion(s)">👍 Like</button>
            <button class="btn btn-success me-2" (click)="addToFavorites(s)">⭐ Ajouter aux favoris</button>
            <!-- AJOUT : Bouton Détails avec routerLink -->
            <button class="btn btn-info" [routerLink]="['/suggestions', s.id]">🔍 Détails</button>
          </div>

          <!-- Message si refusée -->
          <div *ngIf="s.status === 'refusee'" class="text-muted">
            <small>Cette suggestion a été refusée</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <hr />

  <h2>Suggestions favorites</h2>

  <div *ngIf="favorites.length > 0; else noFavorites">
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let fav of favorites">
        {{ fav.title }}
      </li>
    </ul>
  </div>
  
  <ng-template #noFavorites>
    <p class="text-muted">Aucune suggestion favorite</p>
  </ng-template>
</div>
