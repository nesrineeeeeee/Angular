<!-- src/app/features/suggestions/suggestion-details/suggestion-details.component.html -->
<div class="container" *ngIf="suggestion">
  <div class="card">
    <div class="card-header">
      <h2>Détails de la suggestion #{{ suggestion.id }}</h2>
    </div>
    <div class="card-body">
      <h3>{{ suggestion.title }}</h3>
      <p>{{ suggestion.description }}</p>
      <p><strong>Catégorie:</strong> {{ suggestion.category }}</p>
      <p><strong>Date:</strong> {{ suggestion.date | date:'dd/MM/yyyy' }}</p>
      <p><strong>Status:</strong> {{ suggestion.status }}</p>
      <p><strong>Likes:</strong> {{ suggestion.nbLikes }}</p>
      
      <button class="btn btn-warning" (click)="editSuggestion()">Modifier</button>
      <button class="btn btn-danger" (click)="deleteSuggestion()">Supprimer</button>
      <button class="btn btn-primary" (click)="goBack()">Retour</button>
    </div>
  </div>
</div>
